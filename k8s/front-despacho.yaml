apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-despacho
  namespace: innovatech
  labels:
    app: front-despacho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-despacho
  template:
    metadata:
      labels:
        app: front-despacho
    spec:
      containers:
        - name: front-despacho
          # Reemplazar por el registry real de ECR:
          # <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/front-despacho:latest
          image: CHANGE_ME.dkr.ecr.us-east-1.amazonaws.com/front-despacho:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Único servicio expuesto públicamente (Zero Trust):
# los backends quedan internos como ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: front-despacho
  namespace: innovatech
spec:
  type: LoadBalancer
  selector:
    app: front-despacho
  ports:
    - port: 80
      targetPort: 80
